# Local development override: build every modified backend component from this repository.
x-agentflow-api-image: &agentflow-api-image
  image: agentflow-api:local
  build:
    context: ..
    dockerfile: api/Dockerfile

services:
  api:
    <<: *agentflow-api-image
    ports:
      - "5001:5001"

  api_websocket:
    <<: *agentflow-api-image

  worker:
    <<: *agentflow-api-image

  worker_beat:
    <<: *agentflow-api-image

  plugin_daemon:
    dns:
      - ${PLUGIN_DNS_PRIMARY:-223.5.5.5}
      - ${PLUGIN_DNS_SECONDARY:-1.1.1.1}
    environment:
      # AI Studio creates local unsigned packages; production keeps signature verification enabled.
      THIRD_PARTY_SIGNATURE_VERIFICATION_ENABLED: "false"
      FORCE_VERIFYING_SIGNATURE: "false"

  agent_backend:
    image: agentflow-agent-backend:local
    build:
      context: ..
      dockerfile: dify-agent/Dockerfile

  local_sandbox:
    image: agentflow-agent-runtime:local
    build:
      context: ../dify-agent-runtime
      dockerfile: docker/Dockerfile

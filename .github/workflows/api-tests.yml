name: AgentFlow Backend CI

on:
  push:
    paths:
      - "api/**"
      - "dify-agent/**"
      - "docker/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "dify-agent/**"
      - "docker/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentflow-backend-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-core-tests:
    name: Backend Core Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: api/uv.lock

      - name: Check UV lockfile
        run: uv lock --project api --check

      - name: Install dependencies
        run: uv sync --project api --dev

      # The complete upstream Dify suite is kept in the repository but is not
      # part of AgentFlow's required CI while the source snapshot is curated.
      - name: Run AgentFlow backend tests
        run: |
          uv run --project api pytest \
            -p no:benchmark \
            --no-cov \
            --timeout 60 \
            api/tests/unit_tests/configs/test_env_consistency.py \
            api/tests/unit_tests/services/workflow_assist \
            api/tests/unit_tests/core/workflow/generator \
            api/tests/unit_tests/services/tool_plugin_generator

  docker-config:
    name: Docker Configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare local environment
        run: python docker/prepare_dev_env.py

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.local.yaml config --quiet

      - name: Test environment generator
        run: python -m unittest docker.test_prepare_dev_env -v
